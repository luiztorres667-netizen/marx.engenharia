<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marx Engenharia — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#1C1F1D;--green:#00FF88;--gd:#00B868;--bg:#F0EEE6;--paper:#fff;--steel:#4A5A63;--line:rgba(28,31,29,.12);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--g);min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--g);padding:16px 28px;border-bottom:3px solid var(--gd);display:flex;align-items:center;}
.brand-word{font-family:'Big Shoulders Display';font-size:22px;font-weight:900;color:#f0eee6;}
.brand-sub{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.15em;color:var(--gd);}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:var(--paper);border:2px solid var(--g);border-radius:4px;width:100%;max-width:440px;box-shadow:6px 6px 0 var(--g);}
.portal-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--g);}
.ptab{padding:14px;text-align:center;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--steel);border-right:1px solid var(--line);transition:background .15s,color .15s;}
.ptab:last-child{border-right:none;}
.ptab.on{background:var(--g);color:var(--green);}
.form-tabs{display:flex;padding:0 24px;margin-top:22px;border-bottom:1px solid var(--line);}
.ftab{padding:10px 14px;font-family:'IBM Plex Mono';font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--steel);border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
.ftab.on{color:var(--g);border-bottom-color:var(--gd);}
.form-body{padding:24px;}
.form-body h2{font-family:'Big Shoulders Display';font-size:24px;text-transform:uppercase;margin-bottom:4px;}
.form-body p{font-size:13px;color:var(--steel);margin-bottom:20px;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--steel);margin-bottom:5px;}
.field input{width:100%;border:1.5px solid var(--g);border-radius:2px;padding:11px 12px;font-family:'IBM Plex Sans';font-size:14px;background:var(--bg);}
.field input:focus{outline:none;border-color:var(--gd);background:var(--paper);}
.btn{width:100%;background:var(--green);color:var(--g);font-family:'IBM Plex Mono';font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:13px;border:2px solid var(--g);border-radius:2px;cursor:pointer;transition:background .15s;margin-top:6px;}
.btn:hover{background:var(--gd);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5;}
.msg.err{background:#FFF0F0;border:1.5px solid #FFB3B3;color:#C0392B;display:block;}
.msg.ok{background:#F0FFF6;border:1.5px solid #A3E4B7;color:#1E8449;display:block;}
.hint{background:var(--g);color:#f0eee6;padding:12px 24px;font-family:'IBM Plex Mono';font-size:10.5px;border-top:2px solid var(--gd);line-height:1.6;display:none;}
.hint span{color:var(--green);}
.back-link{text-align:center;padding:14px;font-family:'IBM Plex Mono';font-size:11px;}
.back-link a{color:var(--gd);}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="brand-word">MARX ENGENHARIA</div>
    <div class="brand-sub">SCIENTIFIC STUDY</div>
  </div>
</div>
<div class="main">
  <div class="card">
    <div class="portal-tabs">
      <button class="ptab on" id="ptab-c" onclick="setPortal('cliente')">🛒 Portal do Cliente</button>
      <button class="ptab" id="ptab-a" onclick="setPortal('admin')">⚙️ Acesso Admin</button>
    </div>
    <div class="form-tabs">
      <button class="ftab on" id="ftab-login" onclick="setTab('login')">Entrar</button>
      <button class="ftab" id="ftab-reg" onclick="setTab('reg')">Criar conta</button>
    </div>
    <div class="form-body">
      <div id="v-login">
        <h2 id="login-h">Bem-vindo</h2>
        <p id="login-p">Entre com seu e-mail e senha para acessar o catálogo.</p>
        <div class="msg" id="msg-l"></div>
        <div class="field"><label>E-mail</label><input type="email" id="l-email" placeholder="seu@email.com" autocomplete="email"></div>
        <div class="field"><label>Senha</label><input type="password" id="l-senha" placeholder="••••••••" autocomplete="current-password"></div>
        <button class="btn" id="btn-l" onclick="entrar()">Entrar</button>
      </div>
      <div id="v-reg" style="display:none">
        <h2>Criar Conta</h2>
        <p>Preencha os dados abaixo para se cadastrar no sistema.</p>
        <div class="msg" id="msg-r"></div>
        <div class="field"><label>Nome completo</label><input type="text" id="r-nome" placeholder="Seu nome" autocomplete="name"></div>
        <div class="field"><label>E-mail</label><input type="email" id="r-email" placeholder="seu@email.com" autocomplete="email"></div>
        <div class="field"><label>Senha (mínimo 6 caracteres)</label><input type="password" id="r-senha" placeholder="••••••••" autocomplete="new-password"></div>
        <div class="field"><label>Confirmar senha</label><input type="password" id="r-conf" placeholder="••••••••" autocomplete="new-password"></div>
        <button class="btn" id="btn-r" onclick="cadastrar()">Criar conta</button>
      </div>
    </div>
    <div class="hint" id="hint-admin">
      ⚙️ Acesso para <span>gestores e vendedores</span>. Permissões concedidas pelo administrador.
    </div>
    <div class="back-link"><a href="index.html">← Voltar ao catálogo</a></div>
  </div>
</div>

<script>
// ── E-mail do administrador principal ──────────────────────────────────────
// Usuários com este e-mail recebem cargo de admin automaticamente ao se cadastrar
var ADMIN_EMAIL = 'luiztorres667@gmail.com';

var portal = 'cliente';
var tab    = 'login';

function setPortal(p){
  portal = p;
  document.getElementById('ptab-c').className = 'ptab'+(p==='cliente'?' on':'');
  document.getElementById('ptab-a').className = 'ptab'+(p==='admin'?' on':'');
  document.getElementById('hint-admin').style.display = p==='admin'?'block':'none';
  document.getElementById('login-h').textContent = p==='admin'?'Acesso Administrativo':'Bem-vindo';
  document.getElementById('login-p').textContent = p==='admin'
    ? 'Gestores e vendedores entram por aqui.'
    : 'Entre com seu e-mail e senha para acessar o catálogo.';
}

function setTab(t){
  tab = t;
  document.getElementById('ftab-login').className = 'ftab'+(t==='login'?' on':'');
  document.getElementById('ftab-reg').className   = 'ftab'+(t==='reg'?' on':'');
  document.getElementById('v-login').style.display = t==='login'?'':'none';
  document.getElementById('v-reg').style.display   = t==='reg'?'':'none';
}

function showMsg(id,txt,tipo){ var e=document.getElementById(id); e.textContent=txt; e.className='msg '+tipo; }
function clearMsg(id){ var e=document.getElementById(id); e.textContent=''; e.className='msg'; }

function erroFB(code){
  var m={
    'auth/user-not-found':'E-mail não encontrado. Verifique ou crie uma conta.',
    'auth/wrong-password':'Senha incorreta. Tente novamente.',
    'auth/invalid-credential':'E-mail ou senha inválidos.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/email-already-in-use':'Este e-mail já está cadastrado. Faça login.',
    'auth/weak-password':'Senha muito fraca. Use pelo menos 6 caracteres.',
    'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.',
    'auth/network-request-failed':'Erro de conexão. Verifique sua internet.',
    'permission-denied':'Sem permissão. Verifique as regras do banco de dados.',
  };
  return m[code]||('Erro: '+code);
}

// Firebase init lazy
var _auth, _db;
async function initFB(){
  if(_auth) return;
  var {initializeApp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  var {getAuth}       = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
  var {getFirestore}  = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  var app = initializeApp({
    apiKey:"AIzaSyCw3DiBpHlGp8dN9ZSESI6_aq_qsxo5pYw",
    authDomain:"marx-engenharia.firebaseapp.com",
    projectId:"marx-engenharia",
    storageBucket:"marx-engenharia.firebasestorage.app",
    messagingSenderId:"210866809274",
    appId:"1:210866809274:web:66387a9a8f6c15f8841583"
  });
  _auth = getAuth(app);
  _db   = getFirestore(app);
}

// ── ENTRAR ────────────────────────────────────────────────────────────────
async function entrar(){
  clearMsg('msg-l');
  var email = document.getElementById('l-email').value.trim();
  var senha = document.getElementById('l-senha').value;
  if(!email){ showMsg('msg-l','Informe seu e-mail.','err'); return; }
  if(!senha){ showMsg('msg-l','Informe sua senha.','err'); return; }
  var btn=document.getElementById('btn-l'); btn.disabled=true; btn.textContent='Entrando…';
  try{
    await initFB();
    var {signInWithEmailAndPassword} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    var {doc,getDoc,setDoc,serverTimestamp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    var cred = await signInWithEmailAndPassword(_auth,email,senha);
    var snap = await getDoc(doc(_db,'users',cred.user.uid));
    if(!snap.exists()){ showMsg('msg-l','Perfil não encontrado. Recadastre-se.','err'); btn.disabled=false; btn.textContent='Entrar'; return; }
    var role = snap.data().role||'cliente';
    await setDoc(doc(_db,'users',cred.user.uid),{lastLogin:serverTimestamp()},{merge:true});
    if(portal==='admin'&&!['admin','gestor','vendedor'].includes(role)){
      showMsg('msg-l','Você não tem permissão administrativa. Use o Portal do Cliente.','err');
      btn.disabled=false; btn.textContent='Entrar'; return;
    }
    var dest = (portal==='admin'&&['admin','gestor','vendedor'].includes(role))?'admin.html':'index.html';
    showMsg('msg-l','✅ Login realizado! Redirecionando…','ok');
    setTimeout(function(){ window.location.href=dest; },800);
  }catch(e){
    console.error(e);
    showMsg('msg-l',erroFB(e.code||e.message),'err');
    btn.disabled=false; btn.textContent='Entrar';
  }
}

// ── CADASTRAR ─────────────────────────────────────────────────────────────
async function cadastrar(){
  clearMsg('msg-r');
  var nome  = document.getElementById('r-nome').value.trim();
  var email = document.getElementById('r-email').value.trim();
  var senha = document.getElementById('r-senha').value;
  var conf  = document.getElementById('r-conf').value;
  if(!nome)         { showMsg('msg-r','Informe seu nome.','err'); return; }
  if(!email)        { showMsg('msg-r','Informe seu e-mail.','err'); return; }
  if(senha.length<6){ showMsg('msg-r','A senha deve ter no mínimo 6 caracteres.','err'); return; }
  if(senha!==conf)  { showMsg('msg-r','As senhas não conferem.','err'); return; }
  var btn=document.getElementById('btn-r'); btn.disabled=true; btn.textContent='Criando conta…';
  try{
    await initFB();
    var {createUserWithEmailAndPassword} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    var {doc,setDoc,serverTimestamp} = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    var cred = await createUserWithEmailAndPassword(_auth,email,senha);
    // Se o e-mail for o do admin, recebe cargo admin — senão, cliente
    var role = (email.toLowerCase()===ADMIN_EMAIL.toLowerCase()) ? 'admin' : 'cliente';
    await setDoc(doc(_db,'users',cred.user.uid),{
      nome:nome, email:email, role:role,
      criadoEm:serverTimestamp(), lastLogin:serverTimestamp()
    });
    if(role==='admin'){
      showMsg('msg-r','✅ Conta criada! Você é o Administrador do sistema.','ok');
      setTimeout(function(){ window.location.href='admin.html'; },1500);
    } else {
      showMsg('msg-r','✅ Conta criada com sucesso! Aguarde o administrador liberar seu cargo.','ok');
      setTimeout(function(){ window.location.href='index.html'; },1800);
    }
  }catch(e){
    console.error(e);
    showMsg('msg-r',erroFB(e.code||e.message),'err');
    btn.disabled=false; btn.textContent='Criar conta';
  }
}

document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(tab==='login') entrar(); else cadastrar();
});
</script>
</body>
</html>
